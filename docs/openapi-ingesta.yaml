openapi: 3.1.0
info:
  title: AUD — Event ingestion API
  version: 1.0.0
  summary: Security event ingestion for MediNet-Core (Module 11).
  description: |
    Every MediNet-Core module sends its security events to AUD. Requests are
    signed with HMAC-SHA256; see docs/CONTRATO_INGESTA.md for the full contract,
    the event catalog and signing examples.

    Signature: `X-AUD-Signature: sha256=<hex>` where
    `<hex> = hex(HMAC-SHA256(secret, X-AUD-Timestamp + "." + raw_body))`.
    Requests whose timestamp is more than 300 seconds away from the server clock
    are rejected with 401.
  contact:
    name: Grupo 1 (AUD)
servers:
  - url: http://localhost:8080/api/v1
    description: Local development
security:
  - audClientId: []
    audTimestamp: []
    audSignature: []
paths:
  /events:
    post:
      operationId: ingestEvent
      summary: Ingest one security event
      description: |
        Validates and enqueues one event. A repeated `event_id` is discarded
        and still answered with 202 (idempotent ingestion). 202 means queued,
        not yet persisted. Maximum body size: 65536 bytes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Event'
            examples:
              loginFailed:
                $ref: '#/components/examples/LoginFailed'
      responses:
        '202':
          description: Event queued, or `event_id` already received (discarded).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventAccepted'
              example:
                status: accepted
                event_id: 0192f3a4-7b1c-7d2e-9f10-3a4b5c6d7e8f
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /events/batch:
    post:
      operationId: ingestEventBatch
      summary: Ingest up to 100 security events
      description: |
        All or nothing: if any event is invalid the whole batch is rejected with
        400 and nothing is queued. Repeated `event_id` values are discarded
        without error. Maximum body size: 1048576 bytes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventBatch'
            example:
              events:
                - event_id: 0192f3a4-7b1c-7d2e-9f10-3a4b5c6d7e8f
                  source_module: IAM
                  event_type: auth.login_failed
                  severity: LOW
                  actor_id: user-1042
                  actor_type: user
                  source_ip: 203.0.113.24
                  occurred_at: '2026-10-25T14:03:11Z'
                  payload:
                    reason: invalid_password
                    attempt: 3
                - event_id: 0192f3a4-7b1c-7d2e-9f10-3a4b5c6d7e90
                  source_module: IAM
                  event_type: auth.account_locked
                  severity: MEDIUM
                  actor_id: user-1042
                  actor_type: user
                  source_ip: 203.0.113.24
                  occurred_at: '2026-10-25T14:03:12Z'
                  payload:
                    failed_attempts: 5
      responses:
        '202':
          description: Every event in the batch was queued or discarded as a duplicate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchAccepted'
              example:
                status: accepted
                count: 2
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    audClientId:
      type: apiKey
      in: header
      name: X-AUD-Client-Id
      description: Client identifier issued by AUD to the emitting module.
    audTimestamp:
      type: apiKey
      in: header
      name: X-AUD-Timestamp
      description: Current Unix time in seconds (decimal integer). Must be within ±300 s of the server clock.
    audSignature:
      type: apiKey
      in: header
      name: X-AUD-Signature
      description: '`sha256=` + lowercase hex of HMAC-SHA256(secret, timestamp + "." + raw_body).'
  headers:
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 1
  schemas:
    Event:
      type: object
      additionalProperties: false
      required: [event_id, source_module, event_type, severity, occurred_at]
      properties:
        event_id:
          type: string
          format: uuid
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          description: Generated by the emitter; idempotency key. Reuse it on retries.
        source_module:
          $ref: '#/components/schemas/SourceModule'
        event_type:
          $ref: '#/components/schemas/EventType'
        severity:
          $ref: '#/components/schemas/Severity'
        occurred_at:
          type: string
          format: date-time
          description: RFC 3339 with time zone. At most 5 minutes in the future.
        actor_id:
          type: string
          minLength: 1
          maxLength: 128
          description: Internal id of the user or service. Requires `actor_type`.
        actor_type:
          type: string
          enum: [user, service, anonymous]
        target_resource:
          type: string
          minLength: 1
          maxLength: 256
          pattern: '^[a-z][a-z0-9_]*/.+$'
          description: Affected resource as `<type>/<id>`, e.g. `patient/8812`.
        source_ip:
          type: string
          description: IPv4 or IPv6 address of the end user.
          anyOf:
            - format: ipv4
            - format: ipv6
        user_agent:
          type: string
          maxLength: 512
        payload:
          type: object
          default: {}
          description: Event context. At most 16384 bytes serialized. No secrets or clinical data.
      dependentRequired:
        actor_id: [actor_type]
    EventBatch:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/Event'
    SourceModule:
      type: string
      enum: [IAM, PAC, MED, AGT, HCE, PAB, LAB, FAR, TRG, FAC, AUD, TEL]
      description: Must match the module of the authenticated client, otherwise 403.
    EventType:
      type: string
      maxLength: 64
      enum:
        - auth.login_succeeded
        - auth.login_failed
        - auth.account_locked
        - auth.logout
        - auth.password_changed
        - auth.token_rejected
        - iam.user_created
        - iam.user_disabled
        - iam.role_changed
        - iam.permission_changed
        - access.denied
        - access.idor_attempt
        - data.sensitive_read
        - data.record_created
        - data.record_updated
        - data.record_deleted
        - data.export
        - input.rejected
        - file.upload_rejected
        - business.rule_violation
        - security.rate_limited
        - security.config_changed
    Severity:
      type: string
      enum: [INFO, LOW, MEDIUM, HIGH, CRITICAL]
    EventAccepted:
      type: object
      required: [status, event_id]
      properties:
        status:
          type: string
          const: accepted
        event_id:
          type: string
          format: uuid
    BatchAccepted:
      type: object
      required: [status, count]
      properties:
        status:
          type: string
          const: accepted
        count:
          type: integer
          minimum: 1
          maximum: 100
    Problem:
      type: object
      description: RFC 7807 problem details.
      required: [type, title, status]
      properties:
        type:
          type: string
          default: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
                description: JSON path of the invalid field, e.g. `severity` or `events[1].severity`.
              message:
                type: string
  responses:
    BadRequest:
      description: Malformed JSON, missing or invalid field, unknown field, event type outside the catalog, payload over 16 KiB, or empty or oversized batch.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Bad Request
            status: 400
            detail: event validation failed
            errors:
              - field: severity
                message: must be one of INFO, LOW, MEDIUM, HIGH, CRITICAL
    Unauthorized:
      description: Missing header, unknown or inactive client, bad signature, or timestamp outside the ±300 s window. The cause is not disclosed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Unauthorized
            status: 401
            detail: invalid request signature
    Forbidden:
      description: '`source_module` does not match the module of the authenticated client.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Forbidden
            status: 403
            detail: client is not allowed to emit events for this source_module
    ContentTooLarge:
      description: Body exceeds 65536 bytes (1048576 bytes for a batch).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Request Entity Too Large
            status: 413
            detail: request body exceeds 65536 bytes
    UnsupportedMediaType:
      description: Content-Type is not application/json.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Unsupported Media Type
            status: 415
            detail: Content-Type must be application/json
    TooManyRequests:
      description: Client rate limit exceeded.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Too Many Requests
            status: 429
            detail: rate limit exceeded
    InternalServerError:
      description: Unexpected AUD error. Retry with backoff.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Internal Server Error
            status: 500
            detail: internal error
    ServiceUnavailable:
      description: Internal queue full or service shutting down. Retry after Retry-After.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Service Unavailable
            status: 503
            detail: event queue is full
  examples:
    LoginFailed:
      summary: Failed login reported by IAM
      value:
        event_id: 0192f3a4-7b1c-7d2e-9f10-3a4b5c6d7e8f
        source_module: IAM
        event_type: auth.login_failed
        severity: LOW
        actor_id: user-1042
        actor_type: user
        source_ip: 203.0.113.24
        occurred_at: '2026-10-25T14:03:11Z'
        payload:
          reason: invalid_password
          attempt: 3
